name: Build OpenEMS
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - uses: kiancross/checkstyle-annotations-action@v1

      - name: Checkstyle
        run: ./gradlew checkstyleAll --console=colored --warn

      - name: Build all Java packages
        run: ./gradlew build --console=colored --warn

      - name: Resolve OpenEMS bundles
        run: ./gradlew resolve --console=colored --warn

      - name: Validate BackendApp.bndrun
        run: git diff --exit-code io.openems.backend.application/BackendApp.bndrun

      - name: Validate EdgeApp.bndrun
        run: git diff --exit-code io.openems.edge.application/EdgeApp.bndrun

      - name: Generate JaCoCo Code-coverage-report
        run: ./gradlew jacocoTestReport jacocoAggregatedReport

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Cache for Node.js
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.ng
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Build OpenEMS UI
        run: |
          cd ui
          npm ci --prefer-offline --cache ~/.npm
          node_modules/.bin/ng config cli.cache.path "~/.ng"
          npm run lint
          node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"
          export CHROME_BIN=/usr/bin/google-chrome-stable
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: ui
          directory: ./ui/
          token: ${{ secrets.CODECOV_TOKEN }}

  validate-docker:
    name: Validate Docker image (${{ matrix.image }})
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'upstream-release/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openems-backend
            dockerfile: tools/docker/backend/Dockerfile
            platforms: linux/amd64
          - image: openems-ui-backend
            dockerfile: tools/docker/ui/Dockerfile.backend
            platforms: linux/amd64
          - image: openems-edge
            dockerfile: tools/docker/edge/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: openems-ui-edge
            dockerfile: tools/docker/ui/Dockerfile.edge
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.image }}

  docker-validation:
    name: docker-validation
    if: always()
    needs: validate-docker
    runs-on: ubuntu-latest
    steps:
      - name: Require release Docker builds
        env:
          DOCKER_RESULT: ${{ needs.validate-docker.result }}
          REQUIRE_DOCKER: >-
            ${{ github.event_name == 'workflow_call' ||
                (github.event_name == 'pull_request' && startsWith(github.head_ref, 'upstream-release/')) }}
        run: |
          if [[ "$REQUIRE_DOCKER" == "true" && "$DOCKER_RESULT" != "success" ]]; then
            echo "Release Docker validation did not succeed: $DOCKER_RESULT" >&2
            exit 1
          fi
          echo "Docker validation result: $DOCKER_RESULT"
