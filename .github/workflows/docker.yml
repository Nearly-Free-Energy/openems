name: Build NFE OpenEMS images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA reachable from Nearly-Free-Energy/openems:main
        required: true
        type: string
      release_tag:
        description: Unique NFE release tag, e.g. nfe-v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: nfe-openems-image-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: nearly-free-energy

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^nfe-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - name: Verify source commit is on main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openems-backend
            dockerfile: tools/docker/backend/Dockerfile
            platforms: linux/amd64
          - image: openems-ui-backend
            dockerfile: tools/docker/ui/Dockerfile.backend
            platforms: linux/amd64
          - image: openems-edge
            dockerfile: tools/docker/edge/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: openems-ui-edge
            dockerfile: tools/docker/ui/Dockerfile.edge
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for a completed image from an earlier attempt
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          release_ref="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE:$RELEASE_TAG"
          source_ref="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE:sha-$SOURCE_SHA"
          release_digest="$(
            docker buildx imagetools inspect "$release_ref" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest' || true
          )"
          source_digest="$(
            docker buildx imagetools inspect "$source_ref" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest' || true
          )"

          if [[ -z "$release_digest" && -z "$source_digest" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$release_digest" && "$release_digest" == "$source_digest" ]]; then
            {
              echo "skip=true"
              echo "digest=$release_digest"
            } >> "$GITHUB_OUTPUT"
            echo "Reusing completed image from an earlier release attempt: $release_ref"
          else
            echo "Release and source tags are incomplete or point to different images." >&2
            echo "Refusing to overwrite: $release_ref and $source_ref" >&2
            exit 1
          fi
      - id: build
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ inputs.release_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.source=https://github.com/Nearly-Free-Energy/openems
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          {
            echo "## $IMAGE"
            echo
            echo "\`$REGISTRY/$IMAGE_NAMESPACE/$IMAGE@$DIGEST\`"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Platforms: \`$PLATFORMS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  complete:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Record release completion
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          {
            echo "## NFE image release complete"
            echo
            echo "All four images published for \`$RELEASE_TAG\` from \`$SOURCE_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
